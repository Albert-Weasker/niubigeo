<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niubigeo logo preview</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d9dee7;
      --text: #111827;
      --muted: #5b6472;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .panel.dark {
      background: #111827;
      color: #fff;
    }
    .panel.dark p { color: #d1d5db; }
    img { display: block; max-width: 100%; height: auto; }
    .mark-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mark-row img { width: 72px; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>niubigeo logo preview</h1>
    <p>Vector assets for the open-source AI visibility monitor.</p>
    <div class="grid">
      <section class="panel">
        <p>Horizontal lockup</p>
        <img src="./niubigeo-logo-horizontal.svg" alt="niubigeo horizontal logo">
      </section>
      <section class="panel">
        <p>Compact lockup</p>
        <img src="./niubigeo-logo.svg" alt="niubigeo compact logo">
      </section>
      <section class="panel">
        <p>App mark</p>
        <div class="mark-row">
          <img src="./niubigeo-mark.svg" alt="niubigeo mark">
          <strong>niubigeo</strong>
        </div>
      </section>
      <section class="panel dark">
        <p>Dark surface</p>
        <img src="./niubigeo-logo-on-dark.svg" alt="niubigeo horizontal logo on dark surface">
      </section>
    </div>
  </main>
</body>
</html>
