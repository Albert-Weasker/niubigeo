name: Scheduler regression tests

on:
  push:
    branches: [main]
    paths:
      - 'src/product/scheduling/**'
      - 'src/product/projects/**'
      - 'test/product-scheduling.test.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/schedule-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  scheduler:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/product-scheduling.test.js
